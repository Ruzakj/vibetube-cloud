<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="description" content="PLU Timer PLU - timer display berdasarkan jumlah PLU">
  <title>PLU Timer</title>
  <style>
    :root{color-scheme:dark;--bg:#05080d;--panel:#0b121d;--panel-2:#101925;--line:rgba(148,177,214,.14);--text:#edf5ff;--muted:#788ba3;--accent:#66a6ff;--accent-2:#59dbff;--warning:#ffb84d;--danger:#ff6975;--safe:#55d7aa;--shadow:0 18px 55px rgba(0,0,0,.28);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100dvh;background:radial-gradient(circle at 88% 0,rgba(56,105,210,.13),transparent 29%),var(--bg);overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
    .topbar{height:70px;padding:max(12px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(5,8,13,.86);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;letter-spacing:-.025em}.brand::after{content:"WORKFLOW";padding:5px 7px;border:1px solid rgba(102,166,255,.18);border-radius:999px;background:rgba(45,92,160,.14);color:#7fb7ff;font-size:.48rem;letter-spacing:.13em}.ric-back{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);background:rgba(18,29,44,.8);font-size:1.45rem}.install{display:none;border:1px solid rgba(102,166,255,.22);background:rgba(31,76,142,.2);color:#9dcbff;font-weight:750;padding:10px 13px;border-radius:11px;font-size:.67rem}
    .sub{max-width:760px;margin:0 auto;padding:20px 20px 3px;color:var(--muted);font-size:.65rem;letter-spacing:.14em}.sub b{color:#7690ae}.sub span{display:block;margin-top:6px;color:var(--text);font-size:1.55rem;font-weight:800;letter-spacing:-.04em}.notice{max-width:720px;margin:12px auto 0;padding:9px 12px;border:1px solid rgba(255,184,77,.12);border-radius:11px;background:rgba(121,74,12,.12);color:#c99b59;text-align:center;font-size:.65rem;font-weight:700}
    main{width:min(720px,100%);margin:auto;padding:17px 18px max(30px,env(safe-area-inset-bottom))}.helper{margin:2px 1px 4px;color:var(--text);font-size:.78rem;font-weight:750}.formula{margin:0 1px 14px;color:var(--muted);font-size:.62rem}.formula button{border:0;background:none;color:#78b4ff;text-decoration:none;padding:4px;cursor:pointer;font-weight:750}
    #rows{display:flex;flex-direction:column;gap:8px;width:100%;min-height:1px;visibility:visible;opacity:1}.row{display:grid!important;visibility:visible!important;opacity:1!important;grid-template-columns:76px minmax(0,1fr) 92px;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(15,24,37,.94),rgba(10,17,27,.94));box-shadow:0 8px 25px rgba(0,0,0,.13);transition:border-color .15s,transform .15s}.row:focus-within{border-color:rgba(102,166,255,.42);transform:translateY(-1px)}.row.active{border-color:rgba(89,219,255,.5);box-shadow:0 0 0 1px rgba(89,219,255,.12)}
    .label{padding-left:4px;color:#899ab0;font-size:.66rem;font-weight:750}.plu{width:100%;height:48px;border:1px solid rgba(146,177,215,.16);border-radius:11px;padding:0 12px;background:#070d15;color:var(--text);font-size:1.1rem;font-weight:750;outline:0;font-variant-numeric:tabular-nums}.plu::placeholder{color:#405169}.plu:focus{border-color:rgba(102,166,255,.54);box-shadow:0 0 0 3px rgba(83,144,231,.1)}.time{height:42px;border:1px solid rgba(89,219,255,.1);border-radius:10px;display:grid;place-items:center;background:rgba(28,81,139,.18);color:#9bdcff;font-size:.86rem;font-weight:850;font-variant-numeric:tabular-nums}.time.done{border-color:rgba(255,105,117,.25);background:rgba(139,28,39,.22);color:#ff8790}.time.empty{color:#53677f;font-size:.9rem}
    .addbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.addbar button{min-height:42px;border:1px solid var(--line);border-radius:11px;background:rgba(17,28,43,.74);color:#a7b7ca;font-size:.65rem;font-weight:750}
    .summary{position:relative;overflow:hidden;margin-top:14px;padding:19px;border:1px solid rgba(102,166,255,.2);border-radius:18px;background:linear-gradient(145deg,rgba(35,83,153,.24),rgba(12,21,34,.96) 62%);box-shadow:var(--shadow)}.summary::after{content:"";position:absolute;width:150px;height:150px;right:-60px;top:-75px;border-radius:50%;background:rgba(89,219,255,.08);filter:blur(6px)}.sumline{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end}.sumline+.sumline{margin-top:12px;padding-top:11px;border-top:1px solid rgba(149,183,224,.1)}.sumtitle{color:#9fb0c4;font-size:.64rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.sumvalue{font-size:2.2rem;line-height:.9;font-weight:900;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.small{color:#7f91a8;font-size:.65rem;font-weight:700}
    .controls{display:grid;grid-template-columns:1.35fr 1fr;gap:9px;margin-top:11px}.btn{height:56px;border:0;border-radius:13px;color:#fff;font-size:.76rem;font-weight:850;letter-spacing:.01em}.pause{background:linear-gradient(135deg,#367ce4,#4d9bff);box-shadow:0 10px 28px rgba(40,107,205,.24)}.restart{border:1px solid var(--line);background:#111b29;color:#bac9da}.stop-alarm{width:100%;height:48px;margin-top:9px;border:1px solid rgba(255,105,117,.18);border-radius:12px;background:rgba(111,25,34,.16);color:#ff7d87;font-size:.67rem;font-weight:800}.stop-alarm:not(:disabled):active,.btn:active,.addbar button:active{transform:scale(.985)}.stop-alarm:disabled{opacity:.36;cursor:not-allowed}
    .info{margin-top:18px;padding:17px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.info h2{margin:0 0 9px;font-size:.85rem}.info p{margin:5px 0;color:var(--muted);font-size:.67rem;line-height:1.55}.footer{padding:24px;text-align:center;color:#506177;font-size:.58rem}
    dialog{padding:0;width:min(520px,calc(100% - 28px));border:1px solid rgba(151,181,220,.18);border-radius:20px;background:#0b121d;color:var(--text);box-shadow:0 30px 90px rgba(0,0,0,.58)}dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.dialog-body{padding:20px}.dialog-body h3{margin:0 0 16px;font-size:1.05rem}.dialog-body label{display:block;margin:12px 0 6px;color:#8293a9;font-size:.65rem;font-weight:700}.dialog-body input{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#070d15;color:var(--text)}.dialog-actions{display:flex;gap:8px;margin-top:18px}.dialog-actions button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#121d2b;color:var(--text);font-size:.7rem;font-weight:750}
    @media(max-width:520px){.topbar{height:64px;padding-left:12px;padding-right:12px}.brand::after{display:none}.sub{padding:17px 14px 2px}.sub span{font-size:1.35rem}.notice{margin:10px 14px 0}main{padding:14px 12px max(24px,env(safe-area-inset-bottom))}.row{grid-template-columns:62px minmax(0,1fr) 78px;gap:7px;padding:8px}.label{font-size:.59rem}.plu{height:46px;padding:0 9px;font-size:1rem}.time{height:40px;font-size:.76rem}.sumvalue{font-size:1.95rem}.controls{grid-template-columns:1.2fr 1fr}.btn{height:54px}.summary{border-radius:16px}}
    @media(display-mode:standalone) and (orientation:landscape) and (max-height:600px){.topbar{height:54px;padding-top:8px}.sub{display:none}.notice{position:fixed;right:12px;top:58px;z-index:10;margin:0;width:auto}main{max-width:none;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.75fr);gap:10px}.helper,.formula{display:none}#rows{grid-row:1/5}.summary,.controls,.stop-alarm,.addbar{margin-top:0}.row{min-height:48px}.footer{display:none}}
  </style>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#05080d">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/?view=ric-space" class="ric-back" aria-label="Kembali ke Ric Space">‹</a> PLU Timer</div>
    <button id="installBtn" class="install">Pasang Aplikasi</button>
  </header>
  <div class="sub"><b>PLU COUNTDOWN SYSTEM</b><span>Timer kerja lebih terukur.</span></div>
  <div class="notice">● Pastikan volume alarm aktif</div>

  <main>
    <div class="helper">Daftar pekerjaan</div>
    <div class="formula">10 PLU = 1 menit <button id="formulaBtn">(ubah)</button></div>

    <section id="rows">
      <div class="row">
        <div class="label">Baris 1</div>
        <input class="plu" inputmode="numeric" type="number" min="0" placeholder="0" aria-label="PLU baris 1">
        <div class="time empty">--:--</div>
      </div>
      <div class="row">
        <div class="label">Baris 2</div>
        <input class="plu" inputmode="numeric" type="number" min="0" placeholder="0" aria-label="PLU baris 2">
        <div class="time empty">--:--</div>
      </div>
      <div class="row">
        <div class="label">Baris 3</div>
        <input class="plu" inputmode="numeric" type="number" min="0" placeholder="0" aria-label="PLU baris 3">
        <div class="time empty">--:--</div>
      </div>
      <div class="row">
        <div class="label">Baris 4</div>
        <input class="plu" inputmode="numeric" type="number" min="0" placeholder="0" aria-label="PLU baris 4">
        <div class="time empty">--:--</div>
      </div>
      <div class="row">
        <div class="label">Baris 5</div>
        <input class="plu" inputmode="numeric" type="number" min="0" placeholder="0" aria-label="PLU baris 5">
        <div class="time empty">--:--</div>
      </div>
      <div class="row">
        <div class="label">Baris 6</div>
        <input class="plu" inputmode="numeric" type="number" min="0" placeholder="0" aria-label="PLU baris 6">
        <div class="time empty">--:--</div>
      </div>
    </section>

    <div class="addbar">
      <button id="addBtn">＋ Tambah Baris</button>
      <button id="sortBtn">↕ Urutkan PLU</button>
    </div>

    <section class="summary">
      <div class="sumline">
        <div class="sumtitle">Total Sisa Waktu</div>
        <div id="totalTime" class="sumvalue">0:00</div>
      </div>
      <div class="sumline">
        <div class="small">Total PLU</div>
        <div id="totalPlu" class="small">0</div>
      </div>
    </section>

    <div class="controls">
      <button id="pauseBtn" class="btn pause">▶ Mulai Timer</button>
      <button id="restartBtn" class="btn restart">↻ Mulai Ulang</button>
    </div>
    <button id="stopAlarmBtn" class="stop-alarm" disabled>■ Stop Alarm</button>
</main>

  <dialog id="settingsDialog">
    <div class="dialog-body">
      <h3>Pengaturan</h3>
      <label for="secondsPerPlu">Detik / PLU</label>
      <input id="secondsPerPlu" type="number" min="1" step="1" value="6">
      <label for="rowCount">Baris</label>
      <input id="rowCount" type="number" min="1" max="30" step="1" value="6">
      <label for="alarmDuration">Alarm (detik)</label>
      <input id="alarmDuration" type="number" min="5" max="60" step="1" value="20">
      <div class="dialog-actions">
        <button id="cancelSettings">Batal</button>
        <button id="saveSettings" style="background:#111827;color:#fff">Simpan</button>
      </div>
    </div>
  </dialog>

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/7UmSpD/AAAGkAAAAIAAANIAAAAQAAAaQAAAAgAAA0gAAABFVVVVVVVVVVTEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tSZKkP8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/+1JkqQ/wAABpAAAACAAADSAAAAEAAAGkAAAAIAAANIAAAARVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==" preload="auto"></audio>
  <script>

    function safeGet(key){
      try { return localStorage.getItem(key); } catch(e){ return null; }
    }
    function safeSet(key,value){
      try { localStorage.setItem(key,value); } catch(e){}
    }
    function safeJsonGet(key){
      try {
        const v = safeGet(key);
        return v ? JSON.parse(v) : null;
      } catch(e){ return null; }
    }

    const DEFAULT_ROWS = 6;
    let secondsPerPlu = Number(safeGet('secondsPerPlu') || 6);
    let alarmDuration = Number(safeGet('alarmDuration') || 20);
    let rowData = safeJsonGet('pluRows') || Array(DEFAULT_ROWS).fill(0);
    let remaining = 0;
    let running = false;
    let timer = null;
    let lastTick = 0;
    let wakeLock = null;
    let deferredPrompt = null;
    let endAt = 0;
    let notificationTag = 'plu-timer-running';
    let lastNotificationSecond = -1;

    const rowsEl = document.getElementById('rows');
    const totalTimeEl = document.getElementById('totalTime');
    const totalPluEl = document.getElementById('totalPlu');
    const pauseBtn = document.getElementById('pauseBtn');

    function fmt(sec){
      sec = Math.max(0, Math.ceil(sec));
      const m = Math.floor(sec/60), s = sec % 60;
      return `${m}:${String(s).padStart(2,'0')}`;
    }
    function render(){
      rowsEl.innerHTML = '';
      rowData.forEach((value,i)=>{
        const row = document.createElement('div');
        row.className = 'row';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `Baris ${i+1}`;

        const input = document.createElement('input');
        input.className = 'plu';
        input.inputMode = 'numeric';
        input.pattern = '[0-9]*';
        input.min = '0';
        input.type = 'number';
        input.value = value || '';
        input.placeholder = '0';
        input.setAttribute('aria-label', `PLU baris ${i+1}`);

        const time = document.createElement('div');
        time.className = `time ${value ? '' : 'empty'}`;
        time.textContent = value ? fmt(Number(value)*secondsPerPlu) : '--:--';

        row.append(label, input, time);
        input.addEventListener('input',()=>{
          let n = Math.max(0, Math.floor(Number(input.value) || 0));
          rowData[i] = n;
          saveRows();
          updateTotals();
          updateTimes();
        });
        rowsEl.appendChild(row);
      });
      updateTotals();
      updateTimes();
    }
    function saveRows(){ safeSet('pluRows', JSON.stringify(rowData)); }
    function totalPlu(){ return rowData.reduce((a,b)=>a+(Number(b)||0),0); }
    function initialSeconds(){ return totalPlu()*secondsPerPlu; }
    function updateTotals(){
      if(!running) remaining = initialSeconds();
      totalPluEl.textContent = totalPlu();
      totalTimeEl.textContent = fmt(remaining);
    }
    function updateTimes(){
      [...rowsEl.querySelectorAll('.time')].forEach((el,i)=>{
        const v = Number(rowData[i]) || 0;
        el.textContent = v ? fmt(v*secondsPerPlu) : '--:--';
        el.classList.toggle('empty', !v);
      });
    }
    function renderRunningProgress(){
      totalTimeEl.textContent = fmt(remaining);
      let cursor = remaining;
      [...rowsEl.querySelectorAll('.time')].forEach((el,i)=>{
        const rowSec = (Number(rowData[i])||0)*secondsPerPlu;
        if(rowSec<=0){el.textContent='--:--';return}
        const spent = Math.max(0, initialSeconds() - remaining);
        const rowRemain = Math.max(0, rowSec - Math.max(0, spent - (initialSeconds() - rowSec)));
        el.textContent = fmt(rowRemain);
      });
    }
    async function acquireWakeLock(){
      try{
        if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      }catch(e){}
    }
    function releaseWakeLock(){
      if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
    }
    let lastTenBeeped = -1;
    let alarmPlaying = false;
    const suppliedAlarm = document.getElementById('alarmAudio');
    const stopAlarmBtn = document.getElementById('stopAlarmBtn');
    function unlockSuppliedAlarm(){
      // Start button is a user gesture, so this primes the exact uploaded audio
      // for later playback when the countdown reaches 0.
      try{
        suppliedAlarm.muted = true;
        suppliedAlarm.currentTime = 0;
        const p = suppliedAlarm.play();
        if(p && p.then){
          p.then(()=>{
            suppliedAlarm.pause();
            suppliedAlarm.currentTime = 0;
            suppliedAlarm.muted = false;
          }).catch(()=>{
            suppliedAlarm.muted = false;
          });
        }else{
          suppliedAlarm.muted = false;
        }
      }catch(e){
        suppliedAlarm.muted = false;
      }
    }

    async function showAppNotification(body, options={}){
      try{
        if(Notification.permission !== 'granted') return;
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification('PLU Timer', Object.assign({
          body,
          tag: notificationTag,
          renotify: true,
          icon: '/icon.svg',
          badge: '/icon.svg',
          vibrate: [500,250,500,250,900],
          silent: false
        }, options));
      }catch(e){
        try{ new Notification('PLU Timer', {body}); }catch(_){}
      }
    }

    async function updateRunningNotification(force=false){
      if(!running || Notification.permission !== 'granted') return;
      const sec = Math.max(0, Math.ceil(remaining));
      if(!force && sec === lastNotificationSecond) return;
      lastNotificationSecond = sec;
      await showAppNotification(`Sisa waktu: ${fmt(remaining)}`, {
        tag: notificationTag,
        renotify: false,
        vibrate: [],
        silent: true,
        timestamp: Date.now()
      });
    }

    async function closeRunningNotification(){
      try{
        const reg = await navigator.serviceWorker.ready;
        const list = await reg.getNotifications({tag: notificationTag});
        list.forEach(n=>n.close());
      }catch(e){}
    }

    async function beep(){
      stopAlarm();
      try{
        suppliedAlarm.muted = false;
        suppliedAlarm.loop = false;
        suppliedAlarm.currentTime = 0;
        const p = suppliedAlarm.play();
        if(p && p.catch) p.catch(()=>{});
        alarmPlaying = true;
        stopAlarmBtn.disabled = false;
        stopAlarmBtn.textContent = '■ Stop Alarm';
        suppliedAlarm.onended = ()=>{
          alarmPlaying = false;
          stopAlarmBtn.disabled = true;
          stopAlarmBtn.textContent = '■ Stop Alarm';
        };
        if(navigator.vibrate) navigator.vibrate([500,250,500,250,900,250,900]);
        await closeRunningNotification();
        await showAppNotification('Waktu habis', {
          tag: 'plu-timer-finished',
          renotify: true,
          requireInteraction: true,
          vibrate: [700,300,700,300,1200],
          silent: false
        });
      }catch(e){}
    }

    function stopAlarm(){
      try{
        suppliedAlarm.pause();
        suppliedAlarm.currentTime = 0;
        suppliedAlarm.loop = false;
        suppliedAlarm.onended = null;
      }catch(e){}
      alarmPlaying = false;
      stopAlarmBtn.disabled = true;
      stopAlarmBtn.textContent = '■ Stop Alarm';
      if(navigator.vibrate) navigator.vibrate(0);
    }

    function playCountdownCue(sec){
      try{
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if(!Ctx) return;
        const ctx = new Ctx();
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = sec === 10 ? 520 : (sec <= 3 ? 880 : 720);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.13, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t);
        o.stop(t + 0.15);
        setTimeout(()=>{ try{ctx.close()}catch(e){} }, 250);
      }catch(e){}
    }

    async function start(){
      if(remaining<=0) remaining=initialSeconds();
      if(remaining<=0) return;
      if(Notification.permission === 'default'){
        try{await Notification.requestPermission()}catch(e){}
      }
      // Use an absolute deadline instead of counting timer ticks. If Chrome
      // throttles the page in the background, the remaining time is corrected
      // immediately when JS gets CPU time again.
      endAt = Date.now() + Math.ceil(remaining*1000);
      running=true; lastTenBeeped=-1; lastNotificationSecond=-1;
      pauseBtn.textContent='❚❚ Jeda'; lastTick=performance.now();
      unlockSuppliedAlarm(); acquireWakeLock();
      clearInterval(timer);
      updateRunningNotification(true);
      timer=setInterval(()=>{
        const now=performance.now();
        const wallRemaining = (endAt - Date.now())/1000;
        remaining = Math.max(0, wallRemaining);
        lastTick=now;

        if(remaining > 0 && remaining <= 10){
          const sec = Math.ceil(remaining);
          if(sec !== lastTenBeeped){
            lastTenBeeped = sec;
            playCountdownCue(sec);
          }
        }
        if(remaining<=0){
          remaining=0; running=false; clearInterval(timer); releaseWakeLock();
          pauseBtn.textContent='▶ Mulai Timer';
          beep();
        }
        totalTimeEl.textContent=fmt(remaining);
        if(running) updateRunningNotification();
      },250);
    }
    function pause(){
      remaining = Math.max(0, (endAt ? (endAt-Date.now())/1000 : remaining));
      running=false; clearInterval(timer); releaseWakeLock(); pauseBtn.textContent='▶ Mulai Timer';
      safeSet('lastRemaining', String(remaining));
      closeRunningNotification();
    }
    function restart(){
      running=false; clearInterval(timer); releaseWakeLock();
      remaining=initialSeconds(); endAt=0; lastTenBeeped=-1; stopAlarm(); pauseBtn.textContent='▶ Mulai Timer';
      closeRunningNotification();
      render();
    }
    pauseBtn.addEventListener('click',()=>running?pause():start());
    stopAlarmBtn.addEventListener('click', stopAlarm);
    document.getElementById('restartBtn').addEventListener('click',restart);
    document.getElementById('addBtn').addEventListener('click',()=>{rowData.push(0);saveRows();render()});
    document.getElementById('sortBtn').addEventListener('click',()=>{
      rowData=rowData.filter(x=>Number(x)>0).sort((a,b)=>a-b);
      while(rowData.length<DEFAULT_ROWS) rowData.push(0);
      saveRows();render();
    });
    document.getElementById('formulaBtn').addEventListener('click',()=>{
      document.getElementById('secondsPerPlu').value=secondsPerPlu;
      document.getElementById('rowCount').value=rowData.length;
      document.getElementById('alarmDuration').value=alarmDuration;
      document.getElementById('settingsDialog').showModal();
    });
    document.getElementById('cancelSettings').addEventListener('click',()=>document.getElementById('settingsDialog').close());
    document.getElementById('saveSettings').addEventListener('click',()=>{
      secondsPerPlu=Math.max(1,Number(document.getElementById('secondsPerPlu').value)||6);
      alarmDuration=Math.min(60,Math.max(5,Number(document.getElementById('alarmDuration').value)||20));
      safeSet('alarmDuration',String(alarmDuration));
      let count=Math.min(30,Math.max(1,Number(document.getElementById('rowCount').value)||6));
      rowData=rowData.slice(0,count); while(rowData.length<count) rowData.push(0);
      safeSet('secondsPerPlu',String(secondsPerPlu));saveRows();restart();
      document.getElementById('settingsDialog').close();
    });
window.addEventListener('visibilitychange',()=>{
      if(running){
        remaining = Math.max(0, (endAt-Date.now())/1000);
        totalTimeEl.textContent=fmt(remaining);
        if(remaining<=0){
          running=false; clearInterval(timer); releaseWakeLock();
          pauseBtn.textContent='▶ Mulai Timer'; beep();
        }else{
          if(document.visibilityState==='visible') acquireWakeLock();
          updateRunningNotification(true);
        }
      }
    });
    if(!Array.isArray(rowData) || rowData.length === 0){
      rowData = Array(DEFAULT_ROWS).fill(0);
      saveRows();
    }
    render();
  </script>

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/apps/plu-timer/sw.js", {scope:"/apps/plu-timer/"}).catch(()=>{});
  });
}
</script>
